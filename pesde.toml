name = "savruun/sandiego"
version = "0.1.0"
description = "cop game"
authors = ["savruun"]
license = "MIT"

[target]
environment = "roblox"

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"
build = ".pesde/scripts/build.luau"
build-net = '.pesde/scripts/compile_net.luau'
studio = ".pesde/scripts/studio.luau"
start = ".pesde/scripts/start.luau"

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.5.1", target = "lune" }

[engines]
pesde = "^0.7.0"
lune = "^0.10.2"

[dependencies]
quill_core = { name = "featherfall/quill_core", version = "^0.1.0-alpha.2" }
quill_logger = { name = "featherfall/quill_logger", version = "^0.1.0-alpha.2" }
quill_dependencies = { name = "featherfall/quill_dependencies", version = "^0.1.0-alpha.3" }
quill_rblx_components = { name = "featherfall/quill_rblx_components", version = "^0.1.0-alpha.2" }
quill_rblx_lifecycles = { name = "featherfall/quill_rblx_lifecycles", version = "^0.1.0-alpha.1" }
future = { wally = "red-blox/future", version = "^1.0.1" }
ui_labs = { name = "pepeeltoro41/ui_labs", version = "^2.4.2" }
vide = { name = "alicesaidhi/vide", version = "^0.4.1-testing.4" }
maid = { name = "ewdev/maid", version = "^0.1.0" }
wcs = { wally = "cheetiedotpy/wcs", version = "^2.5.0" }
profilestore = { wally = "lm-loleris/profilestore", version = "^1.0.3" }
ezinput = { wally = "breezy1214/ezinput", version = "^0.1.1" }
charm = { wally = "littensy/charm", version = "^0.11.0-rc.5" }
conch = { name = "alicesaidhi/conch", version = "^0.4.0-rc.6" }
conch-ui = { wally = "alicesaidhi/conch-ui", version = "^0.4.0-rc.7" }
cooltransitions = { wally = "savruun/cooltransitions", version = "^0.1.1" }
spring = { wally = "sleitnick/spring", version = "^1.0.0" }
trove = { wally = "sleitnick/trove", version = "^1.8.0" }
topbarplus = { wally = "1foreverhd/topbarplus", version = "^3.4.0" }
